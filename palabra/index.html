<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Artículo del súper</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2A5135">
<meta name="apple-mobile-web-app-title" content="Juega y gana">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../shared/styles.css?v=5">
<link rel="stylesheet" href="game.css?v=5">
</head>
<body>
<main>
  <header class="top">
    <a class="back" href="../index.html" aria-label="Volver al menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title">
      <h1>Artículo del súper</h1>
      <p class="mode" id="mode"></p>
    </div>
    <button type="button" class="switch" id="switch">Practicar</button>
  </header>

  <div class="board-wrap">
    <div class="board" id="board" aria-label="Intentos"></div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>

  <p class="legend">
    <span><i class="correct"></i>En su sitio</span>
    <span><i class="present"></i>En otro sitio</span>
    <span><i class="absent"></i>No está</span>
  </p>

  <div class="keyboard" id="keyboard"></div>
</main>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-labelledby="win-title">
    <div class="medal" id="win-medal"></div>
    <h2 id="win-title"></h2>
    <p class="detail" id="win-detail"></p>
    <p class="prize" id="win-prize"></p>
    <p class="next" id="win-next">Nuevo artículo en <strong id="win-countdown"></strong></p>
    <button type="button" id="practice">Practicar con otro artículo</button>
    <button type="button" class="secondary" id="close">Ver el tablero</button>
  </div>
</div>

<script src="../shared/no-zoom.js?v=5"></script>
<script src="../shared/bridge.js?v=5"></script>
<script src="../shared/sound.js?v=5"></script>
<script src="words.js?v=5"></script>
<script src="game.js?v=5"></script>
</body>
</html>
