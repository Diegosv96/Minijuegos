<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cerditos</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2A5135">
<meta name="apple-mobile-web-app-title" content="Juega y gana">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../shared/styles.css?v=6">
<link rel="stylesheet" href="game.css?v=6">
</head>
<body>
<main>
  <header class="top">
    <a class="back" href="../index.html" aria-label="Volver al menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Cerditos</h1>
    <div class="timer" id="timer" aria-live="off">00:00</div>
  </header>

  <div class="levels" id="levels">
    <button type="button" data-level="easy">Fácil</button>
    <button type="button" data-level="medium">Medio</button>
    <button type="button" data-level="hard">Difícil</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid"></div>
    <div class="pause" id="pause" hidden>
      <p>Pausa</p>
      <span>Toca para seguir</span>
    </div>
  </div>

  <p class="hint">Pon un cerdito en cada fila, columna y corral de la granja, sin que se toquen (ni en diagonal).
    Toca una vez para marcar ×, dos para poner cerdito. Arrastra para marcar varias.</p>

  <div class="tools" id="tools">
    <button type="button" data-action="undo">↶ Deshacer</button>
    <button type="button" data-action="clear">⌫ Vaciar</button>
    <button type="button" data-action="new">↻ Nuevo</button>
  </div>
</main>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-labelledby="win-title">
    <div class="medal" id="win-medal"></div>
    <h2 id="win-title">¡Cosecha completa!</h2>
    <p class="time" id="win-time"></p>
    <p class="prize" id="win-prize"></p>
    <p class="best" id="win-best"></p>
    <button type="button" id="again">Jugar otra vez</button>
  </div>
</div>

<script src="../shared/no-zoom.js?v=6"></script>
<script src="../shared/bridge.js?v=6"></script>
<script src="../shared/sound.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
