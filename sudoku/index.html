<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sudoku de frutas</title>
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="../icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2A5135">
<meta name="apple-mobile-web-app-title" content="Juega y gana">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="../shared/styles.css?v=7">
<link rel="stylesheet" href="game.css?v=7">
</head>
<body>
<main>
  <header class="top">
    <a class="back" href="../index.html" aria-label="Volver al menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <h1>Sudoku de frutas</h1>
    <div class="timer" id="timer" aria-live="off">00:00</div>
  </header>

  <div class="levels" id="levels" role="tablist">
    <button type="button" data-level="easy">Fácil</button>
    <button type="button" data-level="medium">Medio</button>
    <button type="button" data-level="hard">Difícil</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board" role="grid" aria-label="Tablero de sudoku de frutas 6 por 6"></div>
    <div class="pause" id="pause" hidden>
      <p>Pausa</p>
      <span>Toca para seguir</span>
    </div>
  </div>

  <p class="hint">Pon las seis frutas en cada fila, columna y caja, sin repetir ninguna.</p>

  <div class="pad" id="pad">
    <button type="button" data-n="1" class="fruit">🍎</button>
    <button type="button" data-n="2" class="fruit">🍌</button>
    <button type="button" data-n="3" class="fruit">🍇</button>
    <button type="button" data-n="4" class="fruit">🍊</button>
    <button type="button" data-n="5" class="fruit">🥝</button>
    <button type="button" data-n="6" class="fruit">🍓</button>
    <button type="button" class="tool" data-action="undo">↶ Deshacer</button>
    <button type="button" class="tool" data-action="erase">⌫ Borrar</button>
    <button type="button" class="tool" data-action="new">↻ Nuevo</button>
  </div>
</main>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-labelledby="win-title">
    <div class="medal" id="win-medal"></div>
    <h2 id="win-title">¡Resuelto!</h2>
    <p class="time" id="win-time"></p>
    <p class="prize" id="win-prize"></p>
    <p class="best" id="win-best"></p>
    <button type="button" id="again">Jugar otra vez</button>
  </div>
</div>

<script src="../shared/no-zoom.js?v=7"></script>
<script src="../shared/bridge.js?v=7"></script>
<script src="../shared/sound.js?v=7"></script>
<script src="game.js?v=7"></script>
</body>
</html>
